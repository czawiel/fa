<!DOCTYPE html>
<html lang="pl" data-theme="green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROBCO INDUSTRIES - Terminal G.O.A.T. (Vault-Tec)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="green"] {
      --bg-dark: #07130a;
      --bg-card: #0c2112;
      --bg-option: #102c18;
      --bg-option-hover: #194426;
      --fg-main: #4dff79;
      --fg-bright: #d4ffe0;
      --fg-muted: #2ea84e;
      --border: #288c43;
      --accent: #4dff79;
      --img-filter: sepia(100%) hue-rotate(85deg) saturate(220%) brightness(0.95) contrast(1.15);
    }

    [data-theme="amber"] {
      --bg-dark: #140d04;
      --bg-card: #221606;
      --bg-option: #2e1d08;
      --bg-option-hover: #472d0c;
      --fg-main: #ffb642;
      --fg-bright: #fff0d4;
      --fg-muted: #bd8122;
      --border: #9e6b1b;
      --accent: #ffb642;
      --img-filter: sepia(100%) hue-rotate(5deg) saturate(260%) brightness(0.95) contrast(1.15);
    }

    [data-theme="blue"] {
      --bg-dark: #05101a;
      --bg-card: #0a1c2e;
      --bg-option: #0f2942;
      --bg-option-hover: #173f66;
      --fg-main: #4dd5ff;
      --fg-bright: #e0f8ff;
      --fg-muted: #298fb0;
      --border: #207691;
      --accent: #4dd5ff;
      --img-filter: sepia(100%) hue-rotate(155deg) saturate(220%) brightness(0.95) contrast(1.15);
    }

    [data-theme="white"] {
      --bg-dark: #0b0f17;
      --bg-card: #151c28;
      --bg-option: #1e293b;
      --bg-option-hover: #334155;
      --fg-main: #f8fafc;
      --fg-bright: #ffffff;
      --fg-muted: #94a3b8;
      --border: #475569;
      --accent: #38bdf8;
      --img-filter: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--fg-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtelna nakładka linii CRT (można wyłączyć) */
    body.crt-enabled::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.22) 3px,
        rgba(0, 0, 0, 0.22) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    .terminal-wrapper {
      width: 100%;
      max-width: 960px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }

    /* Nagłówek terminala */
    .terminal-header {
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 2px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--fg-bright);
    }

    .brand-sub {
      font-size: 13px;
      color: var(--fg-muted);
      display: block;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: var(--bg-option);
      color: var(--fg-main);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover, .ctrl-btn.active {
      background: var(--accent);
      color: var(--bg-dark);
      border-color: var(--fg-bright);
    }

    /* Pasek postępu */
    .status-strip {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.2);
      gap: 16px;
    }

    .progress-track {
      flex: 1;
      height: 10px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    /* Baner ze zdjęciem z folderu /img */
    .banner-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      max-height: 360px;
      background: #040a06;
      border-bottom: 2px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.25s ease, opacity 0.2s ease;
    }

    body.tint-images .banner-img {
      filter: var(--img-filter);
    }

    .banner-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(5, 14, 8, 0.85);
      color: var(--fg-bright);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 4px;
      z-index: 2;
      backdrop-filter: blur(4px);
    }

    .banner-caption {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(5, 14, 8, 0.85);
      color: var(--fg-main);
      border: 1px solid var(--border);
      padding: 3px 9px;
      font-size: 12px;
      border-radius: 4px;
      z-index: 2;
    }

    /* Zawartość karty */
    .card-body {
      padding: 28px 28px 32px;
    }

    .question-meta {
      font-size: 14px;
      font-weight: 700;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .question-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 23px;
      font-weight: 700;
      color: var(--fg-bright);
      line-height: 1.45;
      margin-bottom: 24px;
    }

    .intro-text {
      font-size: 18px;
      color: var(--fg-bright);
      margin-bottom: 18px;
    }

    .input-group {
      margin: 22px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 15px;
      font-weight: 600;
      color: var(--fg-main);
    }

    .vault-input {
      background: var(--bg-dark);
      border: 2px solid var(--border);
      color: var(--fg-bright);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      padding: 12px 16px;
      border-radius: 6px;
      max-width: 420px;
    }

    .vault-input:focus {
      outline: none;
      border-color: var(--fg-bright);
    }

    /* Lista odpowiedzi */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: var(--bg-option);
      color: var(--fg-bright);
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 17px;
      line-height: 1.5;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .option-btn:hover, .option-btn:focus-visible {
      background: var(--bg-option-hover);
      border-color: var(--fg-bright);
      transform: translateX(4px);
      outline: none;
    }

    .option-btn.selected {
      background: var(--accent);
      color: var(--bg-dark);
      border-color: var(--fg-bright);
      font-weight: 700;
    }

    .option-key {
      background: rgba(0, 0, 0, 0.35);
      color: var(--fg-main);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .option-btn.selected .option-key {
      background: var(--bg-dark);
      color: var(--fg-bright);
    }

    /* Nawigacja dolna */
    .nav-bar {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .primary-btn {
      background: var(--accent);
      color: var(--bg-dark);
      border: 2px solid var(--fg-bright);
      padding: 12px 24px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .primary-btn:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    /* Podsumowanie */
    .result-box {
      background: var(--bg-option);
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .archetype-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--fg-bright);
      margin: 4px 0 8px;
    }

    .job-badge {
      display: inline-block;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 15px;
      color: var(--fg-main);
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .story-paragraph {
      font-size: 17px;
      color: var(--fg-bright);
      margin-bottom: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .stat-item {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 4px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: var(--fg-bright);
      margin-bottom: 6px;
    }

    @media (max-width: 640px) {
      body { font-size: 16px; padding: 10px 8px 32px; }
      .card-body { padding: 18px 16px 24px; }
      .question-title { font-size: 20px; }
      .option-btn { font-size: 16px; padding: 13px 14px; }
    }
  </style>
</head>
<body>

  <main class="terminal-wrapper">
    <!-- Nagłówek terminala -->
    <header class="terminal-header">
      <div>
        <div class="brand-title">ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM v2.077</div>
        <span class="brand-sub">VAULT-TEC PROPRIETARY: PROTOKÓŁ OCENY ZAWODOWEJ G.O.A.T.</span>
      </div>
      <div class="controls-bar">
        <button class="ctrl-btn active" onclick="setTheme('green', this)" title="Klasyczny Zielony Fosfor">GRN</button>
        <button class="ctrl-btn" onclick="setTheme('amber', this)" title="Bursztynowy New Vegas">AMB</button>
        <button class="ctrl-btn" onclick="setTheme('blue', this)" title="Błękit Pip-Boya">BLU</button>
        <button class="ctrl-btn" onclick="setTheme('white', this)" title="Maksymalny Kontrast">MAX KONTRAST</button>
        <button class="ctrl-btn" id="tintBtn" onclick="toggleImageTint()">[ KOLOR ZDJĘĆ: ORYGINAŁ ]</button>
        <button class="ctrl-btn" id="crtBtn" onclick="toggleCRT()">[ CRT: OFF ]</button>
        <button class="ctrl-btn" id="audioBtn" onclick="toggleAudio()">[ DŹWIĘK: ON ]</button>
      </div>
    </header>

    <!-- Pasek stanu -->
    <div class="status-strip">
      <span id="statusLabel">STATUS: LOGOWANIE MIESZKAŃCA KRYPTY 101</span>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <span id="counterLabel">00 / 20</span>
    </div>

    <!-- Baner na zdjęcia z folderu /img -->
    <div class="banner-frame">
      <span class="banner-badge" id="bannerBadge">SLAJD PROJEKTORA: START</span>
      <img id="bannerImage" class="banner-img" alt="Ilustracja pytania G.O.A.T." />
      <span class="banner-caption" id="bannerCaption">VAULT-TEC VISUAL ARCHIVE // /img/</span>
    </div>

    <!-- Dynamiczna zawartość karty -->
    <section class="card-body" id="cardContent"></section>
  </main>

  <script>
    /* ==========================================================================
       KONFIGURACJA ŚCIEŻEK ZDJĘĆ Z FOLDERU /img (ORAZ /img/Fallout/)
       ========================================================================== */
    function getCandidateImagePaths(key, title) {
      const exts = ['jfif', 'jpg', 'jpeg', 'png', 'webp'];
      const bases = [];

      if (key === 'start') {
        bases.push('rozpoczecie', 'rozpoczęcie', 'start', '0', 'intro', 'powitanie', '21');
      } else if (key === 'end') {
        bases.push('zakonczenie', 'zakończenie', 'koniec', '21', '22', 'end', 'podsumowanie');
      } else {
        bases.push(String(key));
        if (Number(key) < 10) bases.push('0' + key);
        bases.push('pytanie' + key, 'q' + key);
      }

      const paths = [];
      for (const b of bases) {
        for (const ext of exts) {
          paths.push(`img/${b}.${ext}`);
          paths.push(`img/Fallout/${b}.${ext}`);
        }
      }
      return paths;
    }

    // Awaryjny slajd SVG, jeśli plik nie zostanie znaleziony w /img
    function createFallbackSlide(label, subtitle) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" width="100%" height="100%">
        <rect width="1200" height="514" fill="#07180c"/>
        <g stroke="#288c43" stroke-width="2" opacity="0.35">
          <line x1="0" y1="128" x2="1200" y2="128"/>
          <line x1="0" y1="257" x2="1200" y2="257"/>
          <line x1="0" y1="385" x2="1200" y2="385"/>
          <line x1="300" y1="0" x2="300" y2="514"/>
          <line x1="600" y1="0" x2="600" y2="514"/>
          <line x1="900" y1="0" x2="900" y2="514"/>
        </g>
        <circle cx="600" cy="220" r="92" fill="none" stroke="#4dff79" stroke-width="8"/>
        <line x1="420" y1="220" x2="508" y2="220" stroke="#4dff79" stroke-width="10"/>
        <line x1="692" y1="220" x2="780" y2="220" stroke="#4dff79" stroke-width="10"/>
        <text x="600" y="238" text-anchor="middle" fill="#d4ffe0" font-family="monospace" font-size="52" font-weight="bold">G.O.A.T.</text>
        <text x="600" y="375" text-anchor="middle" fill="#d4ffe0" font-family="monospace" font-size="30" font-weight="bold">${label}</text>
        <text x="600" y="425" text-anchor="middle" fill="#4dff79" font-family="monospace" font-size="22">${subtitle}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function loadBannerImage(key, label, subtitle) {
      const imgEl = document.getElementById('bannerImage');
      const badgeEl = document.getElementById('bannerBadge');
      const captionEl = document.getElementById('bannerCaption');

      badgeEl.textContent = label;
      const candidates = getCandidateImagePaths(key, subtitle);
      let idx = 0;

      function tryNext() {
        if (idx >= candidates.length) {
          imgEl.onerror = null;
          imgEl.src = createFallbackSlide(label, subtitle);
          captionEl.textContent = `SLAJD ZASTĘPCZY (Brak pliku w /img/${key}.jfif)`;
          return;
        }
        const currentPath = candidates[idx++];
        imgEl.onload = () => {
          captionEl.textContent = `PLIK SLAJDU: /${currentPath}`;
        };
        imgEl.onerror = tryNext;
        imgEl.src = currentPath;
      }

      tryNext();
    }

    /* ==========================================================================
       SYNTEZATOR DŹWIĘKÓW WEB AUDIO API
       ========================================================================== */
    let audioEnabled = true;
    let audioCtx = null;

    function playTone(freq = 660, duration = 0.045, type = 'square') {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

        stats: { S: 7, P: 9, E: 9, C: 5, I: 6, A: 8, L: 8 }
      }
    };

    const QUESTIONS = [
      {
        id: 1,
        shortTitle: "Słodka bułka Butcha",
        question: "Podczas Twoich 10. urodzin w kantynie Butch DeLoria przypiera Cię do metalowej szafki i żąda Twojej świeżo upieczonej, lukrowanej słodkiej bułki. Jak reagujesz?",
        options: [

          { text: "Wskakuję do konsoli sterującej i ręcznie rygluję tłoki hydrauliczne, ratując hermetyczność schronu.", arch: "ENG", trait: "w ostatniej sekundzie zaryglowałeś główne wrota pancerne Krypty" },
          { text: "Spisuję numery identyfikacyjne wszystkich gapiów, którzy zrobili chociaż jeden krok w stronę wyjścia.", arch: "SNI", trait: "sporządziłeś listę niedoszłych uciekinierów podczas incydentu przy głównych wrotach" },
          { text: "Ustawiam aparat pomiarowy w progu, by pobrać pierwszą od dekad próbkę powietrza i pyłu z powierzchni!", arch: "MED", trait: "pobrałeś bezcenne próbki atmosferyczne bezpośrednio z progu Pustkowi" }
        ]
      },
      {
        id: 19,
        shortTitle: "Zmutowany Pies",
        question: "W dolnych korytarzach technicznych staje przed Tobą zdziczały, pokryty bliznami pies o podejrzanie świecących ślepiach i warczy. Jak się zachowasz?",
        options: [
          { text: "Rzucam mu kawałek suszonego mięsa z kieszeni i spokojnie wyciągam dłoń – przyda mi się wierny towarzysz.", arch: "exp", trait: "zyskałeś wiernego czworonożnego towarzysza w ciemnych tunelach" },
          { text: "Opatruję jego rany środkiem antyseptycznym i badam stopień mutacji jego układu nerwowego.", arch: "MED", trait: "udzieliłeś pomocy weterynaryjnej zmutowanemu psu z dolnych poziomów" },
          { text: "Staję w szerokim rozkroku z metalową rurą i warczę głośniej od niego, żeby pokazać, kto tu rządzi!", arch: "REB", trait: "zdominowałeś zmutowanego psa pojedynkiem na groźne spojrzenia i warczenie" },
          { text: "Konstruuję automatyczny podajnik karmy połączony z dzwonkiem alarmowym, robiąc z niego psa stróżującego.", arch: "ENG", trait: "zbudowałeś zautomatyzowany posterunek strażniczy dla psa obronnego" }
        ]
      },
      {
        id: 20,
        shortTitle: "Wybór Nadzorcy",
        question: "Pytanie finałowe i najważniejsze: Kto jest niekwestionowanym filarem naszej społeczności, ojcem narodu w podziemiu i najwyższym autorytetem w Krypcie 101?",
        options: [
          { text: "Nadzorca! (Ponieważ osobiście zatwierdza mój budżet na eksperymenty i przydział odczynników).", arch: "MED", trait: "zadeklarowałeś bezwzględną wierność Nadzorcy w zamian za finansowanie laboratorium" },
          { text: "Nadzorca! (Dopóki nie przejmę jego gabinetu, fotela oraz kodów dostępu do terminala głównego).", arch: "LDR", trait: "złożyłeś przysięgę wierności Nadzorcy, mierząc wzrokiem jego luksusowy fotel" },
          { text: "Nadzorca! (I chętnie doniosę mu na każdego, kto ośmieli się zaznaczyć inną odpowiedź w tym pytaniu!).", arch: "SNI", trait: "zakończyłeś test G.O.A.T. obietnicą donoszenia na mniej entuzjastycznych kolegów" },
          { text: "Nadzorca! (Oczywiście tylko do momentu, aż uda mi się otworzyć właz ewakuacyjny na powierzchnię).", arch: "exp", trait: "uznałeś autorytet Nadzorcy z zastrzeżeniem jurysdykcji ograniczonej do murów Krypty" }
        ]
      }
    ];

    /* ==========================================================================
       STAN APLIKACJI I LOGIKA INTERFEJSU
       ========================================================================== */
    let currentStep = 'start'; // 'start', 0..19, 'end'
    let playerName = "Mieszkaniec #101";
    let userAnswers = new Array(QUESTIONS.length).fill(null);

    const cardContent = document.getElementById('cardContent');
    const progressBar = document.getElementById('progressBar');
    const counterLabel = document.getElementById('counterLabel');
    const statusLabel = document.getElementById('statusLabel');

    function render() {
      if (currentStep === 'start') {
        renderStartScreen();
      } else if (currentStep === 'end') {
        renderEndScreen();
      } else {
        renderQuestionScreen(currentStep);
      }
    }

    function renderStartScreen() {
      progressBar.style.width = '0%';
      counterLabel.textContent = 'START / 20';
      statusLabel.textContent = 'STATUS: OCZEKIWANIE NA ROZPOCZĘCIE PROCEDURY G.O.A.T.';
      loadBannerImage('start', 'SLAJD PROJEKTORA: WPROWADZENIE', 'Wprowadzenie do Testu G.O.A.T.');

      cardContent.innerHTML = `
        <div class="question-meta">PROTOKÓŁ EDUKACYJNY VAULT-TEC // FORMULARZ 101-A</div>
        <h1 class="question-title">OGÓLNY TEST PREDYSPOZYCJI ZAWODOWYCH (G.O.A.T.)</h1>
        <p class="intro-text">
          Witaj, obywatelu! Zgodnie z regulaminem Krypty każdy mieszkaniec po ukończeniu 16. roku życia ma obowiązek przystąpić do standaryzowanego testu sytuacyjnego <strong>G.O.A.T. (Generalized Occupational Aptitude Test)</strong>.
        </p>
        <p class="intro-text">
          Przed Tobą <strong>20 pytań sytuacyjnych</strong> wyświetlanych na osobnych kartach ze slajdami projekcyjnymi. Odpowiadaj szczerze – komputer główny ROBCO przeanalizuje Twoje odruchy moralne, przypisze Ci dożywotni etat w Krypcie oraz wygeneruje pełną symulację Twojego dalszego życia.
        </p>
        <div class="input-group">
          <label for="dwellerName">WPROWADŹ IDENTYFIKATOR MIESZKAŃCA (IMIĘ / KRYPTONIM):</label>
          <input type="text" id="dwellerName" class="vault-input" value="${playerName}" maxlength="32" />
        </div>
        <div class="nav-bar">
          <span style="font-size: 14px; color: var(--fg-muted);">WSKAZÓWKA: Możesz wybierać odpowiedzi myszką lub klawiszami [1-4] / [A-D].</span>
          <button class="primary-btn" onclick="startTest()">[ ROZPOCZNIJ TEST G.O.A.T. &raquo; ]</button>
        </div>
      `;
    }

    function startTest() {
      const input = document.getElementById('dwellerName');
      if (input && input.value.trim() !== '') {
        playerName = input.value.trim();
      }
      playTone(880, 0.08, 'square');
      currentStep = 0;
      render();
    }

    function renderQuestionScreen(index) {
      const q = QUESTIONS[index];
      const numStr = String(q.id).padStart(2, '0');
      const pct = Math.round(((index + 1) / QUESTIONS.length) * 100);

      progressBar.style.width = `${pct}%`;
      counterLabel.textContent = `${numStr} / ${QUESTIONS.length}`;
      statusLabel.textContent = `TESTOWANY: ${playerName.toUpperCase()} // PYTANIE ${numStr}`;

      loadBannerImage(q.id, `PYTANIE ${numStr} // ${q.shortTitle.toUpperCase()}`, q.shortTitle);

      const letters = ['A', 'B', 'C', 'D'];
      const optionsHtml = q.options.map((opt, i) => {
        const isSelected = userAnswers[index] === i ? 'selected' : '';
        return `
          <button class="option-btn ${isSelected}" onclick="selectOption(${i})">
            <span class="option-key">[${letters[i]}]</span>
            <span>${opt.text}</span>
          </button>
        `;
      }).join('');

      cardContent.innerHTML = `
        <div class="question-meta">KARTA PYTANIA ${numStr} Z ${QUESTIONS.length} // SYTUACJA KRYZYSOWA: ${q.shortTitle}</div>
        <h2 class="question-title">${q.question}</h2>
        <div class="options-grid">
          ${optionsHtml}
        </div>
        <div class="nav-bar">
          ${index > 0
            ? `<button class="ctrl-btn" onclick="prevQuestion()">&laquo; POPRZEDNIA KARTA</button>`
            : `<span></span>`
          }
          <span style="font-size: 13px; color: var(--fg-muted);">KLAWIATURA: [A-D] lub [1-4] wybiera odpowiedź</span>
        </div>
      `;
    }

    function selectOption(optIndex) {
      if (typeof currentStep !== 'number') return;
      userAnswers[currentStep] = optIndex;
      playTone(740, 0.05, 'square');

      if (currentStep < QUESTIONS.length - 1) {
        currentStep++;
        render();
      } else {
        playTone(980, 0.14, 'sawtooth');
        currentStep = 'end';
        render();
      }
    }

    function prevQuestion() {
      if (typeof currentStep === 'number' && currentStep > 0) {
        playTone(520, 0.04, 'square');
        currentStep--;
        render();
      }
    }

    function renderEndScreen() {
      progressBar.style.width = '100%';
      counterLabel.textContent = '20 / 20';
      statusLabel.textContent = `ANALIZA ZAKOŃCZONA // AKTA OSOBOWE: ${playerName.toUpperCase()}`;

      loadBannerImage('end', 'PODSUMOWANIE G.O.A.T. // PRZYDZIAŁ ZAWODOWY', 'Twoja Przyszłość w Krypcie!');

      const scores = { ENG: 0, REB: 0, LDR: 0, SNI: 0, MED: 0, exp: 0 };
      const chosenTraits = [];

      userAnswers.forEach((ansIdx, qIdx) => {
        const safeIdx = ansIdx !== null ? ansIdx : 0;
        const choice = QUESTIONS[qIdx].options[safeIdx];
        scores[choice.arch] = (scores[choice.arch] || 0) + 1;
        chosenTraits.push(choice.trait);
      });

      const sortedArchs = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const winnerKey = sortedArchs[0];
      const secondKey = sortedArchs[1];
      const winner = ARCHETYPES[winnerKey];
      const secondary = ARCHETYPES[secondKey];

      const specialLabels = {
        S: 'SIŁA (Strength)',
        P: 'PERCEPCJA (Perception)',
        E: 'WYTRZYMAŁOŚĆ (Endurance)',
        C: 'CHARYZMA (Charisma)',
        I: 'INTELIGENCJA (Intelligence)',
        A: 'ZRĘCZNOŚĆ (Agility)',
        L: 'SZCZĘŚCIE (Luck)'
      };

      const statsHtml = Object.keys(winner.stats).map(k => {
        const val = winner.stats[k];
        return `
          <div class="stat-item">
            <div class="stat-row">
              <span>${specialLabels[k]}</span>
              <span>${val}/10</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${val * 10}%"></div>
            </div>
          </div>
        `;
      }).join('');

      cardContent.innerHTML = `
        <div class="question-meta">OFICJALNY WERDYKT KOMPUTERA GŁÓWNEGO VAULT-TEC</div>
        <h2 class="question-title">GRATULACJE, ${playerName.toUpperCase()}! OTO TWOJA HISTORIA W KRYPCIE:</h2>

        <div class="result-box">
          <div style="font-size: 14px; color: var(--fg-muted);">GŁÓWNY ARCHETYP PRZETRWANIA:</div>
          <div class="archetype-badge">${winner.name}</div>
          <div class="job-badge">PRZYDZIELONY ETAT: ${winner.job}</div>
          <p class="story-paragraph">${winner.desc}</p>
          <p style="font-size: 14px; color: var(--fg-muted);">
            Dodatkowa specjalizacja poboczna: <strong>${secondary.name}</strong>
          </p>
        </div>

        <h3 style="font-size: 18px; color: var(--fg-bright); margin-bottom: 10px;">KRONIKA TWOJEGO ŻYCIA W KRYPCIE 101 (NA PODSTAWIE DECYZJI):</h3>
        <div class="result-box">
          <p class="story-paragraph">
            Twoja legenda w podziemnym społeczeństwie zaczęła się w chwili, gdy ${chosenTraits[0]}, a niedługo potem ${chosenTraits[1]}. W trakcie praktyk zawodowych zasłynąłeś tym, że ${chosenTraits[2]} oraz ${chosenTraits[3]}.
          </p>
          <p class="story-paragraph">
            Kiedy w Krypcie nastały trudniejsze czasy, mieszkańcy zapamiętali, że ${chosenTraits[6]}, a w obliczu zagrożenia w korytarzach ${chosenTraits[7]} i ${chosenTraits[8]}. Nawet podczas awarii infrastruktury ${chosenTraits[10]} oraz ${chosenTraits[14]}.
          </p>
          <p class="story-paragraph" style="margin-bottom: 0;">
            W finale swojej ścieżki kariery ${chosenTraits[17]}, ${chosenTraits[18]} i ostatecznie ${chosenTraits[19]}. Nadzorca osobiście podpisał Twoją teczkę osobową!
          </p>
        </div>

        <h3 style="font-size: 18px; color: var(--fg-bright); margin-bottom: 10px;">PROFIL PSYCHOFIZYCZNY S.P.E.C.I.A.L.:</h3>
        <div class="stats-grid">
          ${statsHtml}
        </div>

        <div class="nav-bar">
          <button class="ctrl-btn" onclick="downloadReport('${winnerKey}')">[ POBIERZ TECZKĘ OSOBOWĄ (.TXT) ]</button>
          <button class="primary-btn" onclick="restartTest()">[ WYPEŁNIJ TEST PONOWNIE ]</button>
        </div>
      `;
    }

    function restartTest() {
      playTone(620, 0.08, 'square');
      userAnswers.fill(null);
      currentStep = 'start';
      render();
    }

    function downloadReport(winnerKey) {
      const winner = ARCHETYPES[winnerKey];
      const lines = [
        "==============================================================",
        "           VAULT-TEC INDUSTRIES - AKTA OSOBOWE G.O.A.T.       ",
        "==============================================================",
        `MIESZKANIEC: ${playerName}`,
        `ARCHETYP PRZETRWANIA: ${winner.name}`,
        `PRZYDZIELONY ETAT: ${winner.job}`,
        "",
        "OPIS PSYCHOLOGICZNY:",
        winner.desc,
        "",
        "WYKAZ ODPOWIEDZI EGZAMINACYJNYCH (1-20):",
        ...QUESTIONS.map((q, i) => {
          const idx = userAnswers[i] !== null ? userAnswers[i] : 0;
          return `${i + 1}. ${q.shortTitle}: ${q.options[idx].text}`;
        }),
        "=============================================================="
      ];
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Certyfikat_GOAT_${playerName.replace(/\s+/g, '_')}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ==========================================================================
       PRZEŁĄCZNIKI MOTYWÓW, FILTRU ZDJĘĆ, CRT I KLAWIATURY
       ========================================================================== */
    function setTheme(themeName, btnEl) {
      document.documentElement.setAttribute('data-theme', themeName);
      document.querySelectorAll('.controls-bar .ctrl-btn').forEach(b => {
        if (['GRN', 'AMB', 'BLU', 'MAX KONTRAST'].includes(b.textContent)) {
          b.classList.remove('active');
        }
      });
      if (btnEl) btnEl.classList.add('active');
      playTone(800, 0.04, 'sine');
    }

    function toggleImageTint() {
      document.body.classList.toggle('tint-images');
      const isTinted = document.body.classList.contains('tint-images');
      document.getElementById('tintBtn').textContent = isTinted
        ? '[ KOLOR ZDJĘĆ: FILTR CRT ]'
        : '[ KOLOR ZDJĘĆ: ORYGINAŁ ]';
      playTone(680, 0.04, 'sine');
    }

    function toggleCRT() {
      document.body.classList.toggle('crt-enabled');
      const isOn = document.body.classList.contains('crt-enabled');
      document.getElementById('crtBtn').textContent = isOn ? '[ CRT: ON ]' : '[ CRT: OFF ]';
      playTone(540, 0.04, 'sine');
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').textContent = audioEnabled ? '[ DŹWIĘK: ON ]' : '[ DŹWIĘK: OFF ]';
      if (audioEnabled) playTone(880, 0.05);
    }

    window.addEventListener('keydown', (e) => {
      if (typeof currentStep !== 'number') return;
      const key = e.key.toUpperCase();
      if (key === '1' || key === 'A') selectOption(0);
      else if (key === '2' || key === 'B') selectOption(1);
      else if (key === '3' || key === 'C') selectOption(2);
      else if (key === '4' || key === 'D') selectOption(3);
      else if (key === 'ARROWLEFT') prevQuestion();
    });

    // Inicjalizacja
    render();
  </script>
</body>
</html>
